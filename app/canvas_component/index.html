<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0d1117;
  font-family: Inter, system-ui, sans-serif;
  overflow-x: hidden;
  user-select: none;
}
#root {
  display: flex; flex-direction: column; gap: 8px;
  padding: 6px 6px 10px; width: 100%;
}

/* ── Toolbar ── */
.toolbar {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 2px 0 4px; min-height: 32px;
}
.btn {
  padding: 4px 11px; border-radius: 6px; border: 1.5px solid #2d3650;
  background: transparent; color: #64748b; cursor: pointer;
  font-size: 11px; font-weight: 600; font-family: inherit; white-space: nowrap; flex-shrink: 0;
}
.btn:hover { border-color: #4a5568; color: #94a3b8; }
.btn.on-paint { border-color: #4ade80; background: #4ade8020; color: #4ade80; }
.btn.on-erase { border-color: #f87171; background: #f8717120; color: #f87171; }
.btn.on-place { border-color: #60a5fa; background: #60a5fa20; color: #60a5fa; }
.btn.on-move  { border-color: #f59e0b; background: #f59e0b20; color: #f59e0b; }
.btn.on-del   { border-color: #f87171; background: #f8717120; color: #f87171; }
.btn.danger:hover { border-color: #f87171; color: #f87171; }
.sep { width: 1px; height: 16px; background: #2d3650; flex-shrink: 0; }
.sl-row { display: flex; align-items: center; gap: 4px; }
.sl-lbl { color: #64748b; font-size: 11px; white-space: nowrap; }
.sl-val { color: #e2e8f0; font-size: 11px; min-width: 24px; text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] {
  -webkit-appearance: none; width: 64px; height: 4px;
  border-radius: 2px; background: #2d3650; cursor: pointer; outline: none; flex-shrink: 0;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px;
  border-radius: 50%; background: #4ade80; cursor: pointer;
}

/* ── Canvas wrapper — fills iframe width, canvas scales via CSS ── */
.cv-outer { width: 100%; position: relative; }
#cvBg {
  /* sits in normal flow to set container height */
  position: relative !important;
  width: 100% !important; height: auto !important;
  display: block; border-radius: 7px; border: 1px solid #2d3650;
}
#cvMain, #cvOver {
  position: absolute; top: 0; left: 0;
  width: 100% !important; height: 100% !important;
  border-radius: 7px;
}
#cursor-ring {
  position: absolute; pointer-events: none; border-radius: 50%;
  border: 2px solid #4ade8080; background: #4ade8010;
  display: none; transform: translate(-50%, -50%);
}

/* ── Well panel — below canvas, full width ── */
.well-panel {
  width: 100%; background: #1e2535;
  border: 1px solid #f59e0b55; border-radius: 8px; padding: 10px 12px;
  display: none; flex-direction: column; gap: 8px;
}
.well-panel.show { display: flex; }
.wp-title { color: #f59e0b; font-size: 12px; font-weight: 700; }
.wp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
.wp-row { display: flex; flex-direction: column; gap: 3px; }
.wp-head { display: flex; justify-content: space-between; }
.wp-head .lbl { color: #64748b; font-size: 11px; }
.wp-head .val { color: #e2e8f0; font-size: 11px; font-variant-numeric: tabular-nums; }
input.wp-sl {
  -webkit-appearance: none; width: 100%; height: 4px;
  border-radius: 2px; background: #2d3650; cursor: pointer; outline: none;
}
input.wp-sl::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px;
  border-radius: 50%; background: #f59e0b; cursor: pointer;
}
.wp-footer {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 6px; border-top: 1px solid #2d3650; margin-top: 2px;
}
.wp-pos { color: #475569; font-size: 10px; }
.wp-del {
  padding: 4px 12px; border-radius: 5px;
  border: 1.5px solid #f8717155; background: #f8717115;
  color: #f87171; cursor: pointer; font-size: 11px; font-weight: 600; font-family: inherit;
}
.hint { color: #475569; font-size: 10px; }
.wcount { color: #64748b; font-size: 11px; }
</style>
</head>
<body>
<div id="root">
  <div class="toolbar" id="tb"></div>
  <div class="cv-outer" id="cvOuter">
    <canvas id="cvBg"></canvas>
    <canvas id="cvMain"></canvas>
    <canvas id="cvOver"></canvas>
    <div id="cursor-ring"></div>
  </div>
  <div class="well-panel" id="wellPanel"></div>
  <div class="hint" id="hint"></div>
</div>

<script>
// ── Streamlit protocol ────────────────────────────────────────────────────────
function toStreamlit(value) {
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:setComponentValue",
    value: value, dataType: "json"
  }, "*");
}
function setHeight(h) {
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:setFrameHeight",
    height: Math.ceil(h)
  }, "*");
}
function autoHeight() {
  requestAnimationFrame(() =>
    setHeight(document.getElementById("root").getBoundingClientRect().height + 14)
  );
}

// ── State ─────────────────────────────────────────────────────────────────────
let N            = 512;
let MODE         = "density";
let densityF32   = null;    // Float32Array — owned by JS after first paint
let wells        = [];      // owned by JS after first edit
let selWell      = -1;
let hovWell      = -1;
let tool         = "paint";
let brushSz      = 36;
let brushStr     = 60;
let painting     = false;
let lastX        = -1, lastY = -1;
let drag         = null;
let initialized  = false;   // true after first streamlit:render
let densityOwned = false;   // true after first density data is set
let wellsOwned   = false;   // true after user first interacts with wells

// ── Viridis ───────────────────────────────────────────────────────────────────
const VIR=[[68,1,84],[72,35,116],[64,67,135],[52,94,141],[41,120,142],
           [32,144,140],[34,167,132],[68,190,112],[121,209,81],[189,222,38],[253,231,37]];
function vir(v) {
  v = Math.max(0, Math.min(1, v));
  const t=v*(VIR.length-1), i=Math.min(Math.floor(t),VIR.length-2), f=t-i;
  const a=VIR[i], b=VIR[i+1];
  return [Math.round(a[0]+(b[0]-a[0])*f), Math.round(a[1]+(b[1]-a[1])*f), Math.round(a[2]+(b[2]-a[2])*f)];
}

// ── DOM refs ──────────────────────────────────────────────────────────────────
let cvBg, cvMain, cvOver, mainCtx, cursorRing;
// Convert internal pixel coords → CSS display pixels
function dispScale() { return cvBg ? cvBg.clientWidth / N : 1; }

// ── First-time setup (runs once ever) ────────────────────────────────────────
function setup() {
  cvBg       = document.getElementById("cvBg");
  cvMain     = document.getElementById("cvMain");
  cvOver     = document.getElementById("cvOver");
  cursorRing = document.getElementById("cursor-ring");

  // Set canvas internal resolution ONCE — never reassign width/height again
  // (reassigning clears the canvas even if value is unchanged)
  cvBg.width   = N; cvBg.height   = N;
  cvMain.width = N; cvMain.height = N;
  cvOver.width = N; cvOver.height = N;

  mainCtx = cvMain.getContext("2d");

  attachEvents(cvOver);
  window.addEventListener("mouseup", onWindowMouseUp);
  initialized = true;
}

// ── Called on every streamlit:render ─────────────────────────────────────────
function onRender(args) {
  const newN    = args.canvas_size || 512;
  const newMODE = args.mode || "density";

  // ── One-time DOM setup ──
  if (!initialized) {
    N = newN;
    setup();
  }

  // ── Mode change: update tool default, rebuild UI ──
  if (newMODE !== MODE) {
    MODE = newMODE;
    if (MODE === "density" && tool !== "paint" && tool !== "erase") tool = "paint";
    if (MODE === "wells"   && tool !== "place" && tool !== "move" && tool !== "del") tool = "place";
    buildToolbar();
    buildHint();
    updateWellPanel();
    render();
    autoHeight();
    return;  // don't touch data on a mode-only change
  }

  // ── First render: load initial data from Streamlit ──
  if (!densityOwned) {
    // Allocate buffer
    densityF32 = new Float32Array(N * N);
    // Load whatever Streamlit has (may be zeroes on fresh start)
    if (args.density_b64) {
      try {
        const bin = atob(args.density_b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const view = new Float32Array(bytes.buffer);
        if (view.length === N * N) densityF32.set(view);
      } catch(e) {}
    }
    densityOwned = true;
  }
  // After densityOwned=true, ALL subsequent density_b64 from Streamlit are echoes of
  // our own emits — ignore them completely. densityF32 is the single source of truth.

  if (!wellsOwned) {
    // Load initial well list from Streamlit
    if (args.wells) {
      try { wells = JSON.parse(args.wells); } catch(e) { wells = []; }
    }
    // Don't set wellsOwned yet — only own wells once the user actually edits them
  }
  // After wellsOwned=true, ignore wells from Streamlit (same echo problem)

  buildToolbar();
  buildHint();
  updateWellPanel();
  render();
  autoHeight();
}

// ── Toolbar ───────────────────────────────────────────────────────────────────
function mkBtn(label, onClick, cls) {
  const b = document.createElement("button");
  b.className = "btn" + (cls ? " " + cls : "");
  b.textContent = label;
  b.addEventListener("mousedown", e => e.stopPropagation());
  b.addEventListener("click", onClick);
  return b;
}
function mkSep() { const d = document.createElement("div"); d.className = "sep"; return d; }
function mkSlider(label, val, min, max, onChange) {
  const row = document.createElement("div"); row.className = "sl-row";
  const lbl = document.createElement("span"); lbl.className = "sl-lbl"; lbl.textContent = label;
  const inp = document.createElement("input"); inp.type = "range";
  inp.min = min; inp.max = max; inp.value = val;
  const valEl = document.createElement("span"); valEl.className = "sl-val"; valEl.textContent = val;
  inp.addEventListener("input", () => { valEl.textContent = inp.value; onChange(+inp.value); });
  row.append(lbl, inp, valEl);
  return row;
}
function buildToolbar() {
  const tb = document.getElementById("tb");
  tb.innerHTML = "";
  if (MODE === "density") {
    const bsRow = mkSlider("Brush", brushSz, 4, 120, v => { brushSz = v; });
    const stRow = mkSlider("Str",   brushStr, 1, 100, v => { brushStr = v; });
    tb.append(
      mkBtn("＋ Paint", () => setTool("paint"), tool === "paint" ? "on-paint" : ""),
      mkBtn("− Erase",  () => setTool("erase"), tool === "erase" ? "on-erase" : ""),
      mkSep(), bsRow, stRow, mkSep(),
      mkBtn("Clear", () => { densityF32.fill(0); render(); emitDensity(); }, "danger")
    );
  } else {
    const cnt = document.createElement("span");
    cnt.className = "wcount";
    cnt.textContent = wells.length + " well" + (wells.length !== 1 ? "s" : "");
    tb.append(
      mkBtn("＋ Place",  () => setTool("place"), tool === "place" ? "on-place" : ""),
      mkBtn("↖ Move",   () => setTool("move"),  tool === "move"  ? "on-move"  : ""),
      mkBtn("✕ Delete", () => setTool("del"),   tool === "del"   ? "on-del"   : ""),
      cnt,
      mkBtn("Clear all", () => {
        wells = []; selWell = -1; wellsOwned = true;
        updateWellPanel(); render(); emitWells(); buildToolbar();
      }, "danger")
    );
  }
}
function setTool(t) {
  tool = t;
  if (t !== "move") { selWell = -1; updateWellPanel(); }
  buildToolbar(); buildHint();
  cvOver.style.cursor = t==="place" ? "crosshair" : t==="del" ? "not-allowed" : t==="move" ? "default" : "none";
}
function buildHint() {
  document.getElementById("hint").textContent = ({
    paint: "Paint density — successive strokes accumulate.",
    erase: "Erase density from the canvas.",
    place: "Click canvas to place a well.",
    move:  "Drag wells to reposition. Click to select and inspect.",
    del:   "Click a well to delete it.",
  })[tool] || "";
}

// ── Well inspector ────────────────────────────────────────────────────────────
function updateWellPanel() {
  const panel = document.getElementById("wellPanel");
  if (selWell < 0 || MODE !== "wells") {
    panel.classList.remove("show");
    autoHeight();
    return;
  }
  const w = wells[selWell];
  panel.innerHTML = `<div class="wp-title">Well ${selWell + 1}</div>`;
  panel.classList.add("show");

  const grid = document.createElement("div"); grid.className = "wp-grid";
  [["rx","Radius X",8,160], ["ry","Radius Y",8,160], ["angle","Angle °",0,179]].forEach(([key,lbl,mn,mx]) => {
    const row  = document.createElement("div"); row.className = "wp-row";
    const head = document.createElement("div"); head.className = "wp-head";
    head.innerHTML = `<span class="lbl">${lbl}</span><span class="val" id="wpv-${key}">${Math.round(w[key])}</span>`;
    const inp = document.createElement("input"); inp.type = "range"; inp.className = "wp-sl";
    inp.min = mn; inp.max = mx; inp.value = w[key];
    inp.addEventListener("input", () => {
      if (selWell < 0) return;
      wells[selWell][key] = +inp.value;
      document.getElementById("wpv-" + key).textContent = Math.round(+inp.value);
      render();
    });
    inp.addEventListener("change", () => emitWells());
    row.append(head, inp);
    grid.appendChild(row);
  });
  panel.appendChild(grid);

  const footer = document.createElement("div"); footer.className = "wp-footer";
  const posEl  = document.createElement("span"); posEl.className = "wp-pos"; posEl.id = "wp-pos";
  posEl.textContent = `x ${Math.round(w.x)}  y ${Math.round(w.y)}`;
  const delBtn = document.createElement("button"); delBtn.className = "wp-del"; delBtn.textContent = "Remove";
  delBtn.addEventListener("click", () => {
    wells.splice(selWell, 1); selWell = -1; wellsOwned = true;
    updateWellPanel(); render(); emitWells(); buildToolbar();
  });
  footer.append(posEl, delBtn);
  panel.appendChild(footer);
  autoHeight();
}

// ── Rendering ─────────────────────────────────────────────────────────────────
let imgData = null;
function render() {
  if (!mainCtx || !densityF32) return;
  // Build viridis image from density
  const D = densityF32;
  let mx = 0; for (let i = 0; i < D.length; i++) if (D[i] > mx) mx = D[i];
  if (!imgData || imgData.width !== N) imgData = new ImageData(N, N);
  const d = imgData.data;
  for (let i = 0; i < N * N; i++) {
    const [r,g,b] = vir(mx > 0 ? D[i] / mx : 0);
    d[i*4]=r; d[i*4+1]=g; d[i*4+2]=b; d[i*4+3]=255;
  }
  // Use drawImage path to avoid clearing: putImageData then composite wells on top
  mainCtx.putImageData(imgData, 0, 0);
  if (MODE === "wells") {
    mainCtx.fillStyle = "rgba(13,17,23,0.5)";
    mainCtx.fillRect(0, 0, N, N);
    drawWells(mainCtx);
  }
}

function drawWells(ctx) {
  wells.forEach((w, i) => {
    const isSel = selWell === i, isHov = hovWell === i;
    const col = isSel ? "#f59e0b" : "#60a5fa";
    ctx.save();
    ctx.translate(w.x, w.y); ctx.rotate(w.angle * Math.PI / 180);
    if (isSel) { ctx.shadowColor = col; ctx.shadowBlur = 14; }
    ctx.beginPath(); ctx.ellipse(0, 0, w.rx, w.ry, 0, 0, Math.PI * 2);
    ctx.fillStyle   = col + (isSel ? "40" : "22");
    ctx.strokeStyle = col + (isSel ? "ff" : isHov ? "cc" : "88");
    ctx.lineWidth   = isSel ? 2 : 1.5;
    ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
    // Major axis
    ctx.beginPath(); ctx.moveTo(-w.rx, 0); ctx.lineTo(w.rx, 0);
    ctx.strokeStyle = col + "99"; ctx.lineWidth = 1;
    ctx.setLineDash([5, 4]); ctx.stroke(); ctx.setLineDash([]);
    // End caps
    for (const ex of [-w.rx, w.rx]) {
      ctx.beginPath(); ctx.moveTo(ex, -5); ctx.lineTo(ex, 5);
      ctx.strokeStyle = col + "bb"; ctx.lineWidth = 1.5; ctx.stroke();
    }
    // Minor axis
    ctx.beginPath(); ctx.moveTo(0, -w.ry); ctx.lineTo(0, w.ry);
    ctx.strokeStyle = col + "44"; ctx.lineWidth = 1;
    ctx.setLineDash([3, 4]); ctx.stroke(); ctx.setLineDash([]);
    // Label
    ctx.font = "bold 11px Inter,sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = col + (isSel ? "ff" : "cc");
    ctx.fillText(i + 1, 0, 0);
    ctx.restore();
  });
}

// ── Brush ─────────────────────────────────────────────────────────────────────
function applyBrush(px, py) {
  const r=brushSz, r2=r*r, str=(brushStr/100)*0.09, sign=tool==="erase"?-1:1;
  const x0=Math.max(0,Math.ceil(px-r)),  x1=Math.min(N-1,Math.floor(px+r));
  const y0=Math.max(0,Math.ceil(py-r)),  y1=Math.min(N-1,Math.floor(py+r));
  for (let y=y0; y<=y1; y++) {
    const dy = y - py;
    for (let x=x0; x<=x1; x++) {
      const d2 = (x-px)*(x-px) + dy*dy;
      if (d2 > r2) continue;
      const f = Math.cos(Math.sqrt(d2)/r * Math.PI*0.5);
      const idx = y*N + x;
      densityF32[idx] = Math.max(0, Math.min(1, densityF32[idx] + sign*str*f*f));
    }
  }
}
function strokeTo(x1, y1) {
  if (lastX < 0) { applyBrush(x1, y1); lastX=x1; lastY=y1; return; }
  const dx=x1-lastX, dy=y1-lastY;
  const steps = Math.max(1, Math.ceil(Math.hypot(dx,dy) / (Math.max(1,brushSz)*0.35)));
  for (let i=1; i<=steps; i++) applyBrush(lastX+dx*(i/steps), lastY+dy*(i/steps));
  lastX=x1; lastY=y1;
}

// ── Hit test ──────────────────────────────────────────────────────────────────
function hitWell(mx, my) {
  for (let i=wells.length-1; i>=0; i--) {
    const w=wells[i], ang=-w.angle*Math.PI/180;
    const dx=mx-w.x, dy=my-w.y;
    const xr=dx*Math.cos(ang)-dy*Math.sin(ang), yr=dx*Math.sin(ang)+dy*Math.cos(ang);
    if ((xr/w.rx)**2 + (yr/w.ry)**2 <= 1.3) return i;
  }
  return -1;
}

// ── Events ────────────────────────────────────────────────────────────────────
function canvasXY(e) {
  const r = cvOver.getBoundingClientRect();
  return [(e.clientX-r.left)*(N/r.width), (e.clientY-r.top)*(N/r.height)];
}
function attachEvents(cv) {
  cv.addEventListener("mousedown", e => {
    e.preventDefault();
    const [x,y] = canvasXY(e);
    if (MODE === "density") {
      painting=true; lastX=-1; lastY=-1;
      strokeTo(x,y); render();
    } else {
      const idx = hitWell(x,y);
      if (tool === "place") {
        wells.push({x, y, rx:45, ry:28, angle:0});
        selWell = wells.length-1;
        wellsOwned = true;
        updateWellPanel(); render(); buildToolbar();
      } else if (tool === "del") {
        if (idx >= 0) {
          wells.splice(idx, 1); selWell=-1; wellsOwned=true;
          updateWellPanel(); render(); emitWells(); buildToolbar();
        }
      } else { // move
        const prev = selWell; selWell = idx;
        if (idx >= 0) drag = {idx, sx:x, sy:y, ox:wells[idx].x, oy:wells[idx].y};
        if (selWell !== prev) updateWellPanel();
        render();
      }
    }
  });

  cv.addEventListener("mousemove", e => {
    const [x,y] = canvasXY(e);
    if (MODE === "density") {
      const sc = dispScale();
      cursorRing.style.display  = "block";
      cursorRing.style.left     = x*sc + "px";
      cursorRing.style.top      = y*sc + "px";
      cursorRing.style.width    = brushSz*2*sc + "px";
      cursorRing.style.height   = brushSz*2*sc + "px";
      cursorRing.style.borderColor = tool==="erase" ? "#f8717188" : "#4ade8088";
      cursorRing.style.background  = tool==="erase" ? "#f8717110" : "#4ade8010";
      if (painting) { strokeTo(x,y); render(); }
    } else {
      cursorRing.style.display = "none";
      const prevH = hovWell; hovWell = hitWell(x,y);
      if (drag) {
        wells[drag.idx].x = drag.ox + (x-drag.sx);
        wells[drag.idx].y = drag.oy + (y-drag.sy);
        const posEl = document.getElementById("wp-pos");
        if (posEl) posEl.textContent = `x ${Math.round(wells[drag.idx].x)}  y ${Math.round(wells[drag.idx].y)}`;
        render();
      } else if (hovWell !== prevH) { render(); }
    }
  });

  cv.addEventListener("mouseup",    onCanvasMouseUp);
  cv.addEventListener("mouseleave", () => { cursorRing.style.display="none"; hovWell=-1; });
}

function onCanvasMouseUp() {
  if (MODE==="density" && painting) { painting=false; lastX=-1; lastY=-1; emitDensity(); }
  else if (drag)                    { wellsOwned=true; emitWells(); drag=null; }
}
function onWindowMouseUp() {
  if (painting) { painting=false; lastX=-1; lastY=-1; emitDensity(); }
  if (drag)     { wellsOwned=true; emitWells(); drag=null; }
}

// ── Emit ──────────────────────────────────────────────────────────────────────
function emitDensity() {
  const bytes=new Uint8Array(densityF32.buffer);
  const CHUNK=65536; let bin="";
  for (let i=0; i<bytes.length; i+=CHUNK)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CHUNK));
  toStreamlit({type:"density", density_b64:btoa(bin), size:N});
}
function emitWells() {
  toStreamlit({type:"wells", wells:JSON.parse(JSON.stringify(wells))});
}

// ── Streamlit message listener — MUST be before componentReady ────────────────
window.addEventListener("message", e => {
  if (!e.data || e.data.type !== "streamlit:render") return;
  onRender(e.data.args || {});
});

window.parent.postMessage({isStreamlitMessage:true, type:"streamlit:componentReady", apiVersion:1}, "*");
</script>
</body>
</html>
